services:
  php:
    container_name: applecms-php
    image: ghcr.nju.edu.cn/hy5528/applecms-php66:latest
    restart: always
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_URL: http://127.0.0.1:8010
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      AUTO_INSTALL: ${AUTO_INSTALL:-0}
      INSTALL_PASSWORD: ${INSTALL_PASSWORD:-admin123}
    ports:
      - "8010:8010"
    command: ["sh", "docker/php/start.sh"]
