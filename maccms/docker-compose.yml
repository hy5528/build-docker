services:
    maccms:
        image: ghcr.nju.edu.cn/hy5528/maccms10:latest
        container_name: maccms
        restart: always
        volumes:
            - ./data:/var/www/html
        ports:
            - 8080:9000
    maccms-db:
        image: yobasystems/alpine-mariadb:latest 
        container_name: maccms-db
        restart: always
        volumes:
            - ./mysql:/var/lib/mysql
        environment:
            - MYSQL_PASSWORD=123456
