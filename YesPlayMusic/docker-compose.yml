services:
  YesPlayMusic:
    build:
      context: .
    image: yesplaymusic
    container_name: YesPlayMusic
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./docker/nginx.conf.example:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 80:80
    restart: always
    depends_on:
      - UnblockNeteaseMusic
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    
    networks:
      my_network:

  UnblockNeteaseMusic:
    image: pan93412/unblock-netease-music-enhanced
    command: -o kugou kuwo migu bilibili pyncmd -p 80:443 -f 45.127.129.53 -e -
    environment:
       # 可添加 UnblockNeteaseMusic 支持的任何环境变量, 支持列表见 https://github.com/UnblockNeteaseMusic/server?tab=readme-ov-file#%E7%8E%AF%E5%A2%83%E5%8F%98%E9%87%8F
      - ENABLE_FLAC=false
      - ENABLE_HTTPDNS=false
      - BLOCK_ADS=true
      - DISABLE_UPGRADE_CHECK=false
      - DEVELOPMENT=false
      - FOLLOW_SOURCE_ORDER=true
      - JSON_LOG=false
      - NO_CACHE=false
      - SELECT_MAX_BR=true
      - LOG_LEVEL=info
      - SEARCH_ALBUM=true
      - ENABLE_FLAC=false
    networks:
      my_network:
        aliases:
          - music.163.com
          - interface.music.163.com
          - interface3.music.163.com
          - interface.music.163.com.163jiasu.com
          - interface3.music.163.com.163jiasu.com
    restart: always

networks:
  my_network:
    driver: bridge
