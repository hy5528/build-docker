name: Build mariadb images

on:
   inputs:
      target:
        description: "选择构建目标 (Select Build Target)"
        required: true
        default: "1panel"
        type: choice
        options:
          - All
          - 1panel
      version:
        description: "指定版本号 (选择单个目标时使用；All 留空则分别获取最新版)"
        required: false
        type: string
      push_latest:
        description: "是否附加 latest 标签 (仅对 V2 有效。编译旧版本时请取消勾选！)"
        required: true
        type: boolean
        default: true    
      
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "1panel1"
            context: "./1panel1"
            dockerfile: "./1panel1/Dockerfile"
            version_url: "https://resource.fit2cloud.com/1panel/package/stable/latest"
            is_latest: false
            
          - name: "1panel"
            context: "./1panel"
            dockerfile: "./1panel/Dockerfile"
            version_url: "https://resource.fit2cloud.com/1panel/package/v2/stable/latest"
            is_latest: true
    
    permissions:
      contents: read
      packages: write
    steps:      
      - name: 检出代码
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/hy5528/${{github.event.inputs.MACH}}
          tags: |
            type=raw,value=latest
      
      
      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v7
        if: steps.check_skip.outputs.skip == 'false'
        with:
          push: true
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像信息
        run: |
          echo "### 🐳 Docker镜像构建成功！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**镜像标签：**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.version_tag }}" ]; then
            echo "**版本标签：** ${{ inputs.version_tag }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ inputs.include_latest }}" == "true" ]; then
            echo "**包含latest标签：** 是" >> $GITHUB_STEP_SUMMARY
          else
            echo "**包含latest标签：** 否" >> $GITHUB_STEP_SUMMARY
          fi
