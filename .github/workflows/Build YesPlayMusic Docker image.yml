name: Build YesPlayMusic Docker image

on:
  workflow_dispatch:

# 避免并发构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/YesPlayMusic
          tags: |
            type=raw,value=latest
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Clone Overleaf Gitlab Repo
        run: |
          git clone https://github.com/junlongzzz/YesPlayMusic.git app

      - name: "Copy userpatches to build folder"
        shell: bash
        run: |
          rsync -av YesPlayMusic/. ./app

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          platforms: linux/amd64, linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
