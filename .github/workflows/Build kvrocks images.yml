name: Build kvrocks Docker images

on:
  push:
    branches: [unstable]
    tags: ['v2.**']
  pull_request:
    paths: ['.github/workflows/nightly.yaml']

jobs:
  build:
    name: "Build nightly docker images"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: apache/kvrocks

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=hy5528/kvrocks",push-by-digest=true,name-canonical=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge and push nightly docker images
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (for unstable)
        id: meta
        if: ${{ github.ref_name == 'unstable' }}
        uses: docker/metadata-action@v5
        with:
          images: hy5528/kvrocks
          flavor: latest=false
          tags: |
            type=sha,prefix=nightly-{{date 'YYYYMMDD'}}-,format=short
            type=raw,value=nightly

      - name: Docker meta (for tags)
        id: meta_tag
        if: ${{ github.ref_name != 'unstable' }}
        uses: docker/metadata-action@v5
        with:
          images: hy5528/kvrocks
          flavor: latest=false
          tags: |
            type=sha,prefix=nightly-{{date 'YYYYMMDD'}}-{{tag}}-,format=short

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'hy5528/kvrocks@sha256:%s ' *)

      - name: Inspect image (for unstable)
        if: ${{ github.ref_name == 'unstable' }}
        run: |
          docker buildx imagetools inspect hy5528/kvrocks:${{ steps.meta.outputs.version }}

      - name: Inspect image (for tags)
        if: ${{ github.ref_name != 'unstable' }}
        run: |
          docker buildx imagetools inspect hy5528/kvrocks:${{ steps.meta_tag.outputs.version }}
