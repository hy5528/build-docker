; ==========================
; 1. 主进程全局配置
; ==========================
[supervisord]
; 日志文件路径
logfile=/var/log/supervisor/supervisord.log 
; 日志级别: critical, error, warn, info, debug, trace
loglevel=info 
; PID 文件路径
pidfile=/var/run/supervisord.pid 
; 【关键】在 Docker 中必须设为 true，使 supervisord 以前台模式运行，否则容器会立即退出
nodaemon=true 
; 最小文件描述符数量，防止高并发下报错
minfds=1024 
; 最小进程数
minprocs=200 

; ==========================
; 2. 子进程管理配置 (每个服务一个 [program:名称])
; ==========================

; 示例 1: Node.js 后端桥接服务
[program:hongguo-bridge]
; 启动命令，建议使用绝对路径或确保 PATH 环境变量正确
command=node /app/server/index.mjs --lan 
; 工作目录
directory=/app/server 
; 自动启动
autostart=true 
; 自动重启: unexpected(意外退出时重启), true(总是重启), false(不重启)
autorestart=true 
; 启动后等待多少秒无异常退出视为启动成功
startsecs=5 
; 启动失败重试次数
startretries=3 
; 标准输出日志文件
stdout_logfile=/var/log/supervisor/bridge-out.log 
; 错误输出日志文件
stderr_logfile=/var/log/supervisor/bridge-err.log 
; 日志文件最大大小，支持 KB, MB, GB
stdout_logfile_maxbytes=10MB 
; 保留的日志备份数量
stdout_logfile_backups=5 
; 将 stderr 重定向到 stdout，简化日志管理
redirect_stderr=false 
; 设置环境变量
environment=NODE_ENV="production",BRIDGE_BIND_IP="0.0.0.0"

; 示例 2: Node.js 前端 Web 服务
[program:hongguo-web]
command=node /app/webapp/server.js
directory=/app/webapp
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/var/log/supervisor/web-out.log
stderr_logfile=/var/log/supervisor/web-err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=false

; ==========================
; 3. 通信与控制接口配置
; ==========================

; Unix Socket 通信 (supervisorctl 默认使用此方式)
[unix_http_server]
file=/var/run/supervisor.sock   ; socket 文件路径
chmod=0700                       ; socket 文件权限

; RPC 接口配置 (supervisorctl 连接服务端所需)
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; 客户端配置 (supervisorctl 读取此段以知道如何连接服务端)
[supervisorctl]
serverurl=unix:///var/run/supervisor.sock ; 通过 unix socket 连接

; 【可选】Web 管理界面 (生产环境建议关闭或限制 IP/密码)
; [inet_http_server]
; port=127.0.0.1:9001
; username=admin
; password=your_secure_password
